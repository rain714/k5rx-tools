<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K5RX-JPN Memory Manager</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{display:flex;gap:8px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #dfe4ec;position:sticky;top:0;z-index:20}.brand{font-weight:800;margin-right:10px}.sub{font-size:12px;color:#6b7280}.btn{height:34px;border:1px solid #d7dde7;background:#fff;border-radius:7px;padding:0 10px}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{background:#b42318;color:#fff;border-color:#b42318}.btn:disabled{opacity:.4;cursor:not-allowed}.spacer{flex:1}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#edf4ff;color:#37517e}.ok{background:#ecfdf3;color:#067647}.bad{background:#fef3f2;color:#b42318}.warn{background:#fff8e7;color:#b54708}.layout{display:grid;grid-template-columns:minmax(860px,1fr) 300px;gap:12px;padding:12px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:10px;overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #e8ecf2}.toolbar input[type=search]{width:260px}.field{height:32px;border:1px solid #d7dde7;border-radius:6px;padding:4px 8px;background:#fff}.tablewrap{height:calc(100vh - 150px);overflow:auto}table{border-collapse:separate;border-spacing:0;width:100%;min-width:940px}th{position:sticky;top:0;background:#f7f9fc;z-index:5;font-size:12px;color:#475569}th,td{border-bottom:1px solid #edf0f5;padding:5px 6px;text-align:left}td input[type=text],td select{width:100%;height:28px;border:1px solid transparent;border-radius:5px;background:transparent}td input:focus,td select:focus{border-color:#9dbaf7;background:#fff;outline:none}.ch{font-weight:700;width:62px}.center{text-align:center}.selected td{background:#eef4ff}.modified td:first-child{box-shadow:inset 3px 0 #f79009}.added td:first-child{box-shadow:inset 3px 0 #12b76a}.deleted td:first-child{box-shadow:inset 3px 0 #f04438}.side{padding:14px}.side h3{margin:0 0 8px;font-size:14px}.bankrow{display:grid;grid-template-columns:52px 1fr;gap:6px;margin:5px 0}.bankrow input{height:30px;border:1px solid #d7dde7;border-radius:6px;padding:4px 7px}.bulk{border-top:1px solid #e8ecf2;margin-top:14px;padding-top:14px}.bulk select{width:100%;margin:4px 0}.status{padding:8px 12px;border-top:1px solid #e8ecf2;font-size:12px;color:#64748b;display:flex;gap:12px}.log{margin:0 12px 12px;padding:10px;background:#101828;color:#d0d5dd;max-height:150px;overflow:auto;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:8px}.modalbg{display:none;position:fixed;inset:0;background:#0f172a66;z-index:50;align-items:center;justify-content:center}.modalbg.show{display:flex}.modal{width:min(680px,92vw);max-height:88vh;overflow:auto;background:#fff;border-radius:12px;padding:18px}.modal h2{margin:0 0 8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{padding:10px;border:1px solid #f1dfa9;background:#fff8e7;border-radius:8px;font-size:12px}.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;max-height:250px;overflow:auto}.hidden{display:none}.progress{width:160px;height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:#2563eb}.small{font-size:12px;color:#64748b}@media(max-width:1000px){.layout{grid-template-columns:1fr}.tablewrap{height:65vh}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">K5RX-JPN Memory Manager</div><div class="sub">Tools v0.1.0 / Schema v2 / 400 Memory slots</div></div>
  <button class="btn primary" id="connect">接続</button><button class="btn" id="disconnect" disabled>切断</button><button class="btn" id="read" disabled>Radio再読込</button>
  <button class="btn" id="backup" disabled>RAW Backup</button><button class="btn" id="template">CSV雛形</button><button class="btn" id="import" disabled>CSV Import</button><button class="btn" id="export" disabled>CSV Export</button><button class="btn" id="undo" disabled>元に戻す</button><button class="btn" id="redo" disabled>やり直す</button>
  <input type="file" id="file" accept=".csv,text/csv" class="hidden">
  <div class="spacer"></div><span class="pill" id="schema">未読込</span><span class="pill warn hidden" id="dirty"></span><span class="small" id="access"></span><div class="progress hidden" id="progress"><div></div></div>
  <button class="btn danger" id="write" disabled>変更なし</button>
</div>
<div class="layout">
<section class="card">
  <div class="toolbar"><input class="field" type="search" id="search" placeholder="CH / Name / Frequencyを検索"><select class="field" id="filter"><option value="all">全400件</option><option value="used">使用中</option><option value="empty">空Memory</option><option value="l1">List 1</option><option value="l2">List 2</option><option value="l3">List 3</option><option value="bank">Bank割当あり</option></select><button class="btn" id="up">↑ 移動</button><button class="btn" id="down">↓ 移動</button><button class="btn" id="duplicate">複製</button><button class="btn" id="clear">クリア</button></div>
  <div class="tablewrap"><table><thead><tr><th class="center"><input type="checkbox" id="all"></th><th>CH</th><th>Name</th><th>Frequency (MHz)</th><th>Mode</th><th>BW</th><th>L1</th><th>L2</th><th>L3</th><th>Bank</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="status"><span id="visible">0 / 400 表示</span><span id="selected">0件選択</span><span>緑:追加 / 橙:変更 / 赤:クリア</span></div>
</section>
<aside class="card side">
  <h3>Bank名</h3><div id="banks"></div>
  <div class="bulk"><h3>一括編集</h3><div class="small" id="bulkInfo">2件以上選択してください。</div><select class="field" id="bulkMode"><option value="">Mode: 変更しない</option><option value="0">FM</option><option value="1">AM</option><option value="2">USB</option></select><select class="field" id="bulkBw"><option value="">BW: 変更しない</option><option value="0">Wide</option><option value="1">Narrow</option></select><select class="field" id="bulkBank"></select><select class="field" id="bulkL1"><option value="">L1: 変更しない</option><option value="1">ON</option><option value="0">OFF</option></select><select class="field" id="bulkL2"><option value="">L2: 変更しない</option><option value="1">ON</option><option value="0">OFF</option></select><select class="field" id="bulkL3"><option value="">L3: 変更しない</option><option value="1">ON</option><option value="0">OFF</option></select><button class="btn primary" id="bulkApply">選択項目へ反映</button></div>
</aside>
</div>
<pre class="log" id="log"></pre>
<div class="modalbg" id="writeModal"><div class="modal"><h2>EEPROMへ変更を書き込む</h2><p id="writeSummary"></p><div class="diff" id="diff"></div><div class="notice" style="margin-top:10px">書込み前に完全なRAW backupを保存してください。変更した各transactionは書込み直後にReadしてVerifyします。Factory/Calibration領域は書込み対象になりません。</div><p><button class="btn" id="modalBackup">RAW backupを保存</button></p><label><input type="checkbox" id="confirmBackup" disabled> このRadio Read時点のbackupを保存しました</label><div class="actions"><button class="btn" id="cancelWrite">キャンセル</button><button class="btn danger" id="confirmWrite" disabled>Write + Verify</button></div></div></div>
<div class="modalbg" id="csvModal"><div class="modal"><h2 id="csvTitle"></h2><div id="csvBody"></div><div class="actions"><button class="btn" id="csvCancel">キャンセル</button><button class="btn primary" id="csvConfirm">続行</button></div></div></div>
<script>
'use strict';
const K={BAUD:38400,SIZE:0x2000,READ:0x80,FACTORY:0x1E00,MAGIC:0x4B355258,SCHEMA:2,CH:400,CHBASE:0x0010,NAMEBASE:0x0C90,NAMEEND:0x1C30,BANKBASE:0x1D30,BANKEND:0x1DB0,XOR:[0x16,0x6C,0x14,0xE6,0x2E,0x91,0x0D,0x40,0x21,0x35,0xD5,0x40,0x13,0x03,0xE9,0x80]};
const $=id=>document.getElementById(id);let radio=null,original=null,working=null,schemaValid=false,backupDone=false,lastAnchor=null,pendingCsv=null;const selected=new Set(),undoStack=[],redoStack=[];
function log(s){$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${s}\n`;$('log').scrollTop=$('log').scrollHeight}function hex(n,w=4){return'0x'+n.toString(16).toUpperCase().padStart(w,'0')}function u32(d,o){return(d[o]|d[o+1]<<8|d[o+2]<<16|d[o+3]<<24)>>>0}function eq(a,b){if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}function ro(i){return K.CHBASE+i*8}function no(i){return K.NAMEBASE+i*10}function bo(i){return K.BANKBASE+(i-1)*16}
function crc(data){let c=0;for(const b of data){c^=b<<8;for(let i=0;i<8;i++){c<<=1;if(c&0x10000)c=(c^0x1021)&0xFFFF}}return c&0xFFFF}function xor(d){for(let i=0;i<d.length;i++)d[i]^=K.XOR[i%16]}function frame(p){const f=new Uint8Array(p.length+8);f.set([0xAB,0xCD,p.length&255,p.length>>8]);f.set(p,4);const c=crc(p);f[4+p.length]=c&255;f[5+p.length]=c>>8;xor(f.subarray(4,6+p.length));f.set([0xDC,0xBA],6+p.length);return f}function unframe(f){const n=f[2]|f[3]<<8;if(f.length!==n+8)throw Error('Frame length mismatch');const b=f.slice(4,6+n);xor(b);const p=b.slice(0,n),got=b[n]|b[n+1]<<8,want=crc(p);if(got!==0xFFFF&&got!==want)throw Error('CRC mismatch');return p}function session(){const x=new Uint8Array(4);crypto.getRandomValues(x);return x}
class Serial{constructor(port){this.port=port;this.rx=[];this.wait=[];this.sid=session()}async open(){await this.port.open({baudRate:K.BAUD,dataBits:8,stopBits:1,parity:'none',flowControl:'none'});this.reader=this.port.readable.getReader();this.writer=this.port.writable.getWriter();this.run=true;this.loop()}async loop(){try{while(this.run){const{value,done}=await this.reader.read();if(done)break;if(value){this.rx.push(...value);this.wait.splice(0).forEach(f=>f())}}}catch(e){if(this.run)log('Serial: '+e.message)}}extract(){while(this.rx.length>1&&!(this.rx[0]===0xAB&&this.rx[1]===0xCD))this.rx.shift();if(this.rx.length<4)return null;const n=this.rx[2]|this.rx[3]<<8;if(n>512){this.rx.shift();return null}if(this.rx.length<n+8)return null;return unframe(Uint8Array.from(this.rx.splice(0,n+8)))}async recv(ms=4000){const end=performance.now()+ms;for(;;){const x=this.extract();if(x)return x;const left=end-performance.now();if(left<=0)throw Error('Receive timeout');await new Promise(r=>{const t=setTimeout(r,Math.min(500,left));this.wait.push(()=>{clearTimeout(t);r()})})}}async req(p,ms){await this.writer.write(frame(p));return this.recv(ms)}async hello(){const p=Uint8Array.from([0x14,0x05,0x04,0,...this.sid]);let last=null;for(let attempt=1;attempt<=5;attempt++){try{this.rx.length=0;const r=await this.req(p,2500);if(r[0]===0x18&&r[1]===0x05)throw Error('Firmware flash mode detected; boot normally');if(r[0]!==0x15||r[1]!==0x05)throw Error('Unexpected session reply');return new TextDecoder('ascii').decode(r.slice(4,20)).replace(/\0.*$/,'').trim()||'(unknown)'}catch(e){last=e;log(`Hello ${attempt}/5 failed: ${e.message}`)}}throw last||Error('Session initialization failed')}async read(off,n){const p=Uint8Array.from([0x1B,0x05,0x08,0,off&255,off>>8,n,0,...this.sid]),r=await this.req(p,4000);if(r[0]!==0x1C||r[1]!==0x05)throw Error('Unexpected read reply');if((r[4]|r[5]<<8)!==off||r[6]!==n)throw Error('Read offset/size mismatch');return r.slice(8,8+n)}async write(off,data){if(off%8||data.length%8||data.length>128)throw Error('Invalid write alignment');for(let x=off;x<off+data.length;x+=8)if(!allowed(x))throw Error('Write guard rejected '+hex(x));const p=new Uint8Array(12+data.length);p.set([0x1D,0x05,data.length+8,0,off&255,off>>8,data.length,1,...this.sid]);p.set(data,12);const r=await this.req(p,4000);if(r[0]!==0x1E||r[1]!==0x05||(r[4]|r[5]<<8)!==off)throw Error('Write ACK mismatch')}async close(){this.run=false;try{await this.reader.cancel();this.reader.releaseLock()}catch{}try{this.writer.releaseLock()}catch{}try{await this.port.close()}catch{}}}
function schemaOK(d){return d.length===K.SIZE&&u32(d,0)===K.MAGIC&&d[4]===K.SCHEMA&&d[5]===16&&(d[8]|d[9]<<8)===K.FACTORY&&(d[10]|d[11]<<8)===400&&d[12]===8&&d[13]===10&&d[14]===8}function ascii(d,o,n,trim=false){let s='';for(let i=0;i<n;i++){const b=d[o+i];if(b===0||b===255||b<32||b>126)break;s+=String.fromCharCode(b)}return trim?s.trimEnd():s}function name(i,d=working){return ascii(d,no(i),10)}function bankName(id,d=working){return ascii(d,bo(id),10,true)||`BANK${id}`}function decode(i,d=working){const r=d.slice(ro(i),ro(i)+8),er=r.every(b=>b===255),f=r[0]|r[1]<<8|r[2]<<16|(r[3]&7)<<24,empty=er||f===0||f===0x07FFFFFF;return{raw:r,empty,freq:empty?null:f/100000,rawfreq:f,name:name(i,d),mod:er?0:r[5]&7,bw:er?0:(r[3]>>5)&1,lists:er?0:r[6]&7,bank:er?0:(r[6]&0x78)>>3}}function ascii10(s){if(!/^[\x20-\x7E]*$/.test(s)||new TextEncoder().encode(s).length>10)throw Error('Name must be printable ASCII, max 10 bytes')}function ensure(i){const o=ro(i),r=working.slice(o,o+8);if(!r.every(b=>b===255))return;working.fill(0,o,o+8);working[o+5]=4<<3}function setName(i,s){ascii10(s);working.fill(0,no(i),no(i)+10);for(let x=0;x<s.length;x++)working[no(i)+x]=s.charCodeAt(x)}function setBankName(id,s){ascii10(s);working.fill(32,bo(id),bo(id)+10);for(let x=0;x<s.length;x++)working[bo(id)+x]=s.charCodeAt(x)}function parseFreq(s){const n=Number(s),r=Math.round(n*100000);if(!Number.isFinite(n)||!((r>=1800000&&r<63000000)||(r>=84000000&&r<=130000000)))throw Error('RX range: 18–<630 MHz or 840–1300 MHz');return r}function setFreq(i,s){ensure(i);const r=parseFreq(s),o=ro(i);working[o]=r&255;working[o+1]=r>>8;working[o+2]=r>>16;working[o+3]=(working[o+3]&0xF8)|(r>>24&7)}function setMode(i,v){ensure(i);working[ro(i)+5]=(working[ro(i)+5]&0xF8)|(Number(v)&7)}function setBw(i,v){ensure(i);working[ro(i)+3]=(working[ro(i)+3]&~0x20)|((Number(v)&1)<<5)}function setList(i,b,on){ensure(i);const o=ro(i)+6;working[o]=on?working[o]|b:working[o]&~b}function setBank(i,id){ensure(i);const o=ro(i)+6;working[o]=(working[o]&~0x78)|((Number(id)<<3)&0x78)}function clearMem(i){working.fill(255,ro(i),ro(i)+8);working.fill(0,no(i),no(i)+10)}function swap(a,b){const ar=working.slice(ro(a),ro(a)+8),an=working.slice(no(a),no(a)+10),br=working.slice(ro(b),ro(b)+8),bn=working.slice(no(b),no(b)+10);working.set(br,ro(a));working.set(bn,no(a));working.set(ar,ro(b));working.set(an,no(b))}function copy(a,b){working.set(working.slice(ro(a),ro(a)+8),ro(b));working.set(working.slice(no(a),no(a)+10),no(b))}
function allowed(o){return o%8===0&&((o>=K.CHBASE&&o+8<=K.NAMEEND)||(o>=K.BANKBASE&&o+8<=K.BANKEND))}function blocks(){if(!original||!working)return[];const a=[];for(let o=0;o<K.FACTORY;o+=8)if(!eq(original.slice(o,o+8),working.slice(o,o+8)))a.push(o);return a}function chunks(){const a=[];for(const o of blocks()){const q=a.at(-1);if(q&&o===q.end&&q.end-q.start<128)q.end+=8;else a.push({start:o,end:o+8})}return a}function dirtyMem(i){return original&&!eq(original.slice(ro(i),ro(i)+8),working.slice(ro(i),ro(i)+8))||original&&!eq(original.slice(no(i),no(i)+10),working.slice(no(i),no(i)+10))}function present(i,d){const m=decode(i,d);return !m.empty||!!m.name}function changeType(i){if(!dirtyMem(i))return'';const a=present(i,original),b=present(i,working);return !a&&b?'added':a&&!b?'deleted':'modified'}function validate(){const e=[];for(let i=0;i<400;i++){const m=decode(i);if(m.empty&&(m.name||m.lists||m.bank))e.push(`M${String(i+1).padStart(3,'0')}: frequency required`);if(!m.empty&&!((m.rawfreq>=1800000&&m.rawfreq<63000000)||(m.rawfreq>=84000000&&m.rawfreq<=130000000)))e.push(`M${String(i+1).padStart(3,'0')}: invalid frequency`);if(!m.empty&&m.mod>2)e.push(`M${String(i+1).padStart(3,'0')}: invalid modulation`);if(!m.empty&&m.bank>8)e.push(`M${String(i+1).padStart(3,'0')}: invalid Bank`)}return e}
function bankOptions(v){let s=`<option value="0" ${v===0?'selected':''}>0 — UNBANKED</option>`;for(let i=1;i<=8;i++)s+=`<option value="${i}" ${v===i?'selected':''}>${i} — ${esc(bankName(i))}</option>`;return s}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function match(i){const m=decode(i),q=$('search').value.toLowerCase().trim(),f=$('filter').value;let ok=f==='all'||f==='used'&&!m.empty||f==='empty'&&m.empty||f==='l1'&&(m.lists&1)||f==='l2'&&(m.lists&2)||f==='l3'&&(m.lists&4)||f==='bank'&&m.bank;if(!ok)return false;if(!q)return true;return`m${String(i+1).padStart(3,'0')}`.includes(q)||m.name.toLowerCase().includes(q)||(m.freq?.toFixed(5)||'').includes(q)||bankName(m.bank||1).toLowerCase().includes(q)}
function render(){const rows=$('rows');if(!working){rows.innerHTML='<tr><td colspan="10" style="padding:30px;text-align:center">Radioへ接続してEEPROMを読み込んでください。</td></tr>';$('banks').innerHTML='';return}let html='',n=0;for(let i=0;i<400;i++){if(!match(i))continue;n++;const m=decode(i),sel=selected.has(i);html+=`<tr data-i="${i}" class="${sel?'selected ':''}${changeType(i)}"><td class="center"><input class="sel" type="checkbox" ${sel?'checked':''}></td><td class="ch">M${String(i+1).padStart(3,'0')}</td><td><input data-k="name" type="text" maxlength="10" value="${esc(m.name)}"></td><td><input data-k="freq" type="text" value="${m.empty?'':m.freq.toFixed(5)}"></td><td><select data-k="mode"><option value="0" ${m.mod===0?'selected':''}>FM</option><option value="1" ${m.mod===1?'selected':''}>AM</option><option value="2" ${m.mod===2?'selected':''}>USB</option></select></td><td><select data-k="bw"><option value="0" ${m.bw===0?'selected':''}>Wide</option><option value="1" ${m.bw===1?'selected':''}>Narrow</option></select></td><td class="center"><input data-k="l1" type="checkbox" ${m.lists&1?'checked':''}></td><td class="center"><input data-k="l2" type="checkbox" ${m.lists&2?'checked':''}></td><td class="center"><input data-k="l3" type="checkbox" ${m.lists&4?'checked':''}></td><td><select data-k="bank">${bankOptions(m.bank<=8?m.bank:0)}</select></td></tr>`}rows.innerHTML=html;$('visible').textContent=`${n} / 400 表示`;$('selected').textContent=`${selected.size}件選択`;let bh='';for(let i=1;i<=8;i++)bh+=`<div class="bankrow"><span>B${i}</span><input data-bank="${i}" maxlength="10" value="${esc(bankName(i))}"></div>`;$('banks').innerHTML=bh;let bb='<option value="">Bank: 変更しない</option><option value="0">UNBANKED</option>';for(let i=1;i<=8;i++)bb+=`<option value="${i}">${i} — ${esc(bankName(i))}</option>`;$('bulkBank').innerHTML=bb;$('bulkInfo').textContent=selected.size>=2?`${selected.size}件選択中`:'2件以上選択してください。';status()}
function status(){const b=blocks(),unsafe=b.filter(x=>!allowed(x));$('dirty').classList.toggle('hidden',!b.length);$('dirty').textContent=`${b.length} block変更`;$('write').disabled=!radio||!schemaValid||!b.length||unsafe.length;$('write').textContent=b.length?'Radioへ書込':'変更なし';$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}function mutate(fn){if(!working)return;undoStack.push(working.slice());if(undoStack.length>30)undoStack.shift();redoStack.length=0;try{fn()}catch(e){working=undoStack.pop();throw e}render()}function undo(){if(!undoStack.length||!working)return;redoStack.push(working.slice());working=undoStack.pop();render()}function redo(){if(!redoStack.length||!working)return;undoStack.push(working.slice());working=redoStack.pop();render()}
$('rows').addEventListener('click',e=>{if(!e.target.classList.contains('sel'))return;e.preventDefault();const i=Number(e.target.closest('tr').dataset.i),on=!selected.has(i);if(e.shiftKey&&lastAnchor!==null){for(let x=Math.min(i,lastAnchor);x<=Math.max(i,lastAnchor);x++)on?selected.add(x):selected.delete(x)}else on?selected.add(i):selected.delete(i);lastAnchor=i;render()});$('rows').addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr||e.target.classList.contains('sel'))return;const i=Number(tr.dataset.i),k=e.target.dataset.k;try{mutate(()=>{if(k==='name')setName(i,e.target.value);if(k==='freq')setFreq(i,e.target.value);if(k==='mode')setMode(i,e.target.value);if(k==='bw')setBw(i,e.target.value);if(k==='l1')setList(i,1,e.target.checked);if(k==='l2')setList(i,2,e.target.checked);if(k==='l3')setList(i,4,e.target.checked);if(k==='bank')setBank(i,e.target.value)})}catch(err){alert(err.message);render()}});$('banks').addEventListener('change',e=>{if(!e.target.dataset.bank)return;try{mutate(()=>setBankName(Number(e.target.dataset.bank),e.target.value))}catch(err){alert(err.message);render()}});$('search').oninput=render;$('filter').onchange=render;$('all').onchange=e=>{selected.clear();if(e.target.checked)for(let i=0;i<400;i++)if(match(i))selected.add(i);render()};
function one(){if(selected.size!==1)throw Error('Memoryを1件だけ選択してください。');return[...selected][0]}$('up').onclick=()=>{try{const i=one();if(i>0){mutate(()=>swap(i,i-1));selected.clear();selected.add(i-1);render()}}catch(e){alert(e.message)}};$('down').onclick=()=>{try{const i=one();if(i<399){mutate(()=>swap(i,i+1));selected.clear();selected.add(i+1);render()}}catch(e){alert(e.message)}};$('duplicate').onclick=()=>{try{const i=one();let d=-1;for(let x=i+1;x<400;x++)if(decode(x).empty){d=x;break}if(d<0)for(let x=0;x<i;x++)if(decode(x).empty){d=x;break}if(d<0)throw Error('空きMemoryがありません。');mutate(()=>copy(i,d));selected.clear();selected.add(d);render()}catch(e){alert(e.message)}};$('clear').onclick=()=>{if(!selected.size)return alert('Memoryを選択してください。');if(confirm(`${selected.size}件のMemoryをクリアしますか？`))mutate(()=>selected.forEach(clearMem))};$('bulkApply').onclick=()=>{if(selected.size<2)return alert('2件以上のMemoryを選択してください。');mutate(()=>{for(const i of selected){if($('bulkMode').value!=='')setMode(i,$('bulkMode').value);if($('bulkBw').value!=='')setBw(i,$('bulkBw').value);if($('bulkBank').value!=='')setBank(i,$('bulkBank').value);for(const[k,b]of[['bulkL1',1],['bulkL2',2],['bulkL3',4]])if($(k).value!=='')setList(i,b,$(k).value==='1')}})};$('undo').onclick=undo;$('redo').onclick=redo;
function access(text,pct=null){$('access').textContent=text||'';$('progress').classList.toggle('hidden',pct===null);if(pct!==null)$('progress').firstElementChild.style.width=pct+'%'}async function connect(){if(!navigator.serial||!window.isSecureContext)throw Error('Web Serialを使用するにはChrome/EdgeをHTTPSまたはlocalhostで開いてください。');const preserve=!!(working&&blocks().length),p=await navigator.serial.requestPort(),d=new Serial(p);await d.open();try{const v=await d.hello();radio=d;$('connect').disabled=true;$('disconnect').disabled=false;$('read').disabled=false;log('接続: '+v);if(preserve){log('Offline編集を保持しました。Write前にRadio全体とbaselineの一致を確認します。');status()}else await readAll(true)}catch(e){await d.close();radio=null;$('connect').disabled=false;$('disconnect').disabled=true;$('read').disabled=true;access('',null);status();throw e}}async function readAll(auto=false){if(!auto&&blocks().length&&!confirm('未保存の変更を破棄してRadioを再読込しますか？'))return;const d=new Uint8Array(K.SIZE);for(let o=0;o<K.SIZE;o+=128){d.set(await radio.read(o,128),o);access(`EEPROM読込 ${Math.round((o+128)*100/K.SIZE)}%`,Math.round((o+128)*100/K.SIZE))}access('',null);original=d.slice();working=d.slice();backupDone=false;selected.clear();undoStack.length=0;redoStack.length=0;const ok=schemaOK(d);schemaValid=ok;$('schema').textContent=ok?'Schema v2':'Schema不一致';$('schema').className='pill '+(ok?'ok':'bad');$('backup').disabled=false;$('import').disabled=!ok;$('export').disabled=!ok;render();log(`EEPROM ${d.length} byte読込完了`)}async function disconnect(){await radio?.close();radio=null;$('connect').disabled=false;$('disconnect').disabled=true;$('read').disabled=true;status();log('切断')}
function download(bytes,name,type='application/octet-stream'){const u=URL.createObjectURL(new Blob([bytes],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){if(!original)return;download(original,`k5rx-jpn-backup-${new Date().toISOString().replace(/[:.]/g,'-')}.raw`);backupDone=true;$('confirmBackup').disabled=false;log('Backup download requested')}
function csvq(v){const s=String(v??'');return/[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}function exportCsv(banks=true){const lines=['record,name,frequency,modulation,bandwidth,list1,list2,list3,bank'];if(banks)for(let i=1;i<=8;i++)lines.push([`B${i}`,bankName(i),'','','','','','',''].map(csvq).join(','));for(let i=0;i<400;i++){const m=decode(i);lines.push([`M${String(i+1).padStart(3,'0')}`,m.empty?'':m.name,m.empty?'':m.freq.toFixed(5),m.empty?'':['FM','AM','USB'][m.mod],m.empty?'':m.bw?'Narrow':'Wide',m.empty?0:m.lists&1?1:0,m.empty?0:m.lists&2?1:0,m.empty?0:m.lists&4?1:0,m.empty?0:m.bank].map(csvq).join(','))}download(lines.join('\r\n')+'\r\n','k5rx-jpn-memory.csv','text/csv;charset=utf-8')}function templateCsv(banks=true){const lines=['record,name,frequency,modulation,bandwidth,list1,list2,list3,bank'];if(banks)for(let i=1;i<=8;i++)lines.push([`B${i}`,`BANK${i}`,'','','','','','',''].map(csvq).join(','));for(let i=1;i<=400;i++)lines.push([`M${String(i).padStart(3,'0')}`,'','','','',0,0,0,0].map(csvq).join(','));download(lines.join('\r\n')+'\r\n','k5rx-jpn-template.csv','text/csv;charset=utf-8')}
function line(s){const a=[];let x='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){x+='"';i++}else if(c==='"')q=false;else x+=c}else if(c==='"')q=true;else if(c===','){a.push(x);x=''}else x+=c}a.push(x);return a}function inspectCsv(t){const ls=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),h=line(ls.shift()).map(x=>x.trim().toLowerCase());if(!h.includes('record')&&h.includes('channel'))h[h.indexOf('channel')]='record';const req=['record','name','frequency','modulation','bandwidth','list1','list2','list3','bank'];for(const x of req)if(!h.includes(x))throw Error('Missing column '+x);const ix=x=>h.indexOf(x),mem=new Map(),banks=new Map();for(const l of ls){const c=line(l),id=(c[ix('record')]||'').trim().toUpperCase();if(/^B[1-8]$/.test(id)){const b=Number(id.slice(1));if(banks.has(b))throw Error('Duplicate '+id);for(const x of req.slice(2))if(String(c[ix(x)]||'').trim())throw Error(id+' may only use record/name');banks.set(b,c[ix('name')]||'');continue}const m=id.match(/^M?(\d{1,3})$/);if(!m)throw Error('Invalid record '+id);const n=Number(m[1]);if(n<1||n>400||mem.has(n))throw Error('Invalid/duplicate '+id);mem.set(n,c)}if(mem.size!==400)throw Error(`CSV must contain 400 Memory rows; found ${mem.size}`);return{h,mem,banks}}
function bool(v){return['1','true','on','yes'].includes(String(v).trim().toLowerCase())}function importCsv(t,doBanks){const{x:h,mem,banks}=(()=>{const z=inspectCsv(t);return{x:z.h,mem:z.mem,banks:z.banks}})(),ix=x=>h.indexOf(x),next=working.slice();const save=working;working=next;try{for(let n=1;n<=400;n++){const c=mem.get(n),i=n-1,nm=c[ix('name')]||'',fs=(c[ix('frequency')]||'').trim(),l1=bool(c[ix('list1')]),l2=bool(c[ix('list2')]),l3=bool(c[ix('list3')]),bk=Number((c[ix('bank')]||'0').trim()||0);ascii10(nm);if(!fs){if(nm||l1||l2||l3||bk)throw Error(`M${String(n).padStart(3,'0')}: frequency required`);clearMem(i);continue}setFreq(i,fs);setName(i,nm);const md=(c[ix('modulation')]||'').toUpperCase();setMode(i,md==='FM'||md==='0'?0:md==='AM'||md==='1'?1:md==='USB'||md==='2'?2:(()=>{throw Error('Invalid modulation')})());const bw=(c[ix('bandwidth')]||'').toLowerCase();setBw(i,bw==='wide'||bw==='w'||bw==='0'?0:bw==='narrow'||bw==='n'||bw==='1'?1:(()=>{throw Error('Invalid bandwidth')})());setList(i,1,l1);setList(i,2,l2);setList(i,4,l3);if(!Number.isInteger(bk)||bk<0||bk>8)throw Error('Invalid Bank');setBank(i,bk)}if(doBanks)for(const[b,nm]of banks)setBankName(b,nm)}catch(e){working=save;throw e}undoStack.push(save.slice());if(undoStack.length>30)undoStack.shift();redoStack.length=0;working=next;render()}
function humanDiff(){const out=[];for(let i=0;i<400;i++)if(dirtyMem(i)){const a=decode(i,original),b=decode(i,working),id=`M${String(i+1).padStart(3,'0')}`;out.push(`${id}: ${a.empty?'EMPTY':`${a.name} ${a.freq.toFixed(5)}`} -> ${b.empty?'EMPTY':`${b.name} ${b.freq.toFixed(5)}`}`)}for(let i=1;i<=8;i++)if(!eq(original.slice(bo(i),bo(i)+16),working.slice(bo(i),bo(i)+16)))out.push(`B${i}: ${bankName(i,original)} -> ${bankName(i,working)}`);return out}
async function doWrite(){const err=validate();if(err.length)throw Error(err[0]);const current=new Uint8Array(K.SIZE);for(let o=0;o<K.SIZE;o+=K.READ){current.set(await radio.read(o,K.READ),o);access(`Baseline確認 ${Math.round((o+K.READ)*100/K.SIZE)}%`,Math.round((o+K.READ)*100/K.SIZE))}if(!eq(current,original)){let first=0;while(first<K.SIZE&&current[first]===original[first])first++;throw Error(`編集開始時からRadio EEPROMが変更されています（最初の差分 ${hex(first)}）。Radioを再読込して変更を適用し直してください。`)}const cs=chunks();for(let i=0;i<cs.length;i++){const c=cs[i],data=working.slice(c.start,c.end);access(`書込み ${i+1}/${cs.length}`,Math.round(i*100/cs.length));await radio.write(c.start,data);const got=await radio.read(c.start,data.length);if(!eq(got,data))throw Error('Verify失敗: '+hex(c.start));original.set(got,c.start)}access('',null);backupDone=false;undoStack.length=0;redoStack.length=0;$('writeModal').classList.remove('show');render();log('Write + Verify完了')}
$('connect').onclick=()=>connect().catch(e=>{log(e.message);alert(e.message)});$('disconnect').onclick=()=>disconnect().catch(e=>alert(e.message));$('read').onclick=()=>readAll().catch(e=>{access('',null);alert(e.message)});$('backup').onclick=backup;$('modalBackup').onclick=backup;$('write').onclick=()=>{const e=validate();if(e.length)return alert(e.join('\n'));const b=blocks(),u=b.filter(x=>!allowed(x));if(u.length)return alert('許可されていないEEPROM blockが変更されています: '+u.map(hex).join(', '));$('writeSummary').textContent=`${b.length} changed 8-byte block / ${chunks().length} write transaction`;$('diff').textContent=humanDiff().join('\n')||'変更なし';$('confirmBackup').checked=false;$('confirmBackup').disabled=!backupDone;$('confirmWrite').disabled=true;$('writeModal').classList.add('show')};$('cancelWrite').onclick=()=>$('writeModal').classList.remove('show');$('confirmBackup').onchange=e=>$('confirmWrite').disabled=!e.target.checked;$('confirmWrite').onclick=()=>doWrite().catch(e=>{access('',null);log('WRITE ERROR '+e.message);alert(e.message+'\n\nRadioを再読込してEEPROM状態を確認してください。')});
$('template').onclick=()=>{$('csvTitle').textContent='CSV雛形を作成';$('csvBody').innerHTML='<label><input id="bankOpt" type="checkbox" checked> B1〜B8 Bank rowを含める</label><p class="small">全400 Memory rowを含む編集用CSVを生成します。Bank rowの初期名称はBANK1〜BANK8です。</p>';$('csvModal').classList.add('show');pendingCsv={type:'template'}};$('export').onclick=()=>{$('csvTitle').textContent='CSV Export';$('csvBody').innerHTML='<label><input id="bankOpt" type="checkbox" checked> B1〜B8 Bank nameを含める</label><p class="small">Bank rowはM001〜M400より前に出力し、record/name列だけを使用します。</p>';$('csvModal').classList.add('show');pendingCsv={type:'export'}};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const t=await f.text(),info=inspectCsv(t);pendingCsv={type:'import',text:t,banks:info.banks.size};$('csvTitle').textContent='CSV Import';$('csvBody').innerHTML=`<p>400 Memory row / ${info.banks.size} Bank rowを検出しました。</p><label><input id="bankOpt" type="checkbox" ${info.banks.size?'checked':'disabled'}> B1〜B8 Bank nameも取り込む</label><p class="small">Importはworking modelだけを変更します。Radioへの書込みは「Radioへ書込」を実行するまで行いません。</p>`;$('csvModal').classList.add('show')}catch(err){alert(err.message)}};$('csvCancel').onclick=()=>{$('csvModal').classList.remove('show');pendingCsv=null};$('csvConfirm').onclick=()=>{try{if(pendingCsv?.type==='template')templateCsv($('bankOpt').checked);else if(pendingCsv?.type==='export')exportCsv($('bankOpt').checked);else if(pendingCsv?.type==='import')importCsv(pendingCsv.text,$('bankOpt').checked);$('csvModal').classList.remove('show');pendingCsv=null}catch(e){alert(e.message)}};
